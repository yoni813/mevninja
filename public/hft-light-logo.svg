<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="logoGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <linearGradient id="logoArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="85%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Flare -->
  <circle cx="256" cy="230" r="160" fill="#0EA5E9" opacity="0.15" filter="url(#logoGlow)" />
  <circle cx="280" cy="240" r="150" fill="#10B981" opacity="0.15" filter="url(#logoGlow)" />

  <!-- Main Emblem Scaled to 512x512 -->
  <g transform="translate(245, 235) scale(0.9)">
    <!-- Electric Trails -->
    <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="-220" y1="110" x2="-180" y2="80" />
      <line x1="-190" y1="60" x2="-150" y2="30" />
      <line x1="-160" y1="0" x2="-110" y2="-30" />
    </g>

    <g stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="140" y1="-50" x2="190" y2="-90" />
      <line x1="150" y1="0" x2="190" y2="-30" />
      <line x1="130" y1="50" x2="170" y2="30" />
    </g>

    <!-- LEFT FLANK: Blue Stock Graph -->
    <polyline 
      points="-170,100 -125,15 -80,60 -25,-40 30,30 100,-70" 
      fill="none" 
      stroke="#0284C7" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <polyline 
      points="-170,100 -125,15 -80,60 -25,-40 30,30 100,-70" 
      fill="none" 
      stroke="#38BDF8" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <polyline 
      points="-170,100 -125,15 -80,60 -25,-40 30,30 100,-70" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Graph Nodes -->
    <g fill="#0284C7" stroke="#FFFFFF" stroke-width="2.5">
      <circle cx="-170" cy="100" r="7" />
      <circle cx="-125" cy="15" r="7" />
      <circle cx="-80" cy="60" r="7" />
      <circle cx="-25" cy="-40" r="8" />
      <circle cx="30" cy="30" r="7" />
    </g>
    <g fill="#38BDF8">
      <circle cx="-170" cy="100" r="3" />
      <circle cx="-125" cy="15" r="3" />
      <circle cx="-80" cy="60" r="3" />
      <circle cx="-25" cy="-40" r="4" fill="#FFFFFF" />
      <circle cx="30" cy="30" r="3" />
    </g>

    <!-- RIGHT FLANK: Green Circuit Board -->
    <path 
      d="M -25 -40 L 40 30 L 40 90 L 95 90 L 125 60 L 125 0 L 95 -30" 
      fill="none" 
      stroke="#059669" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M -25 -40 L 40 30 L 40 90 L 95 90 L 125 60 L 125 0 L 95 -30" 
      fill="none" 
      stroke="#10B981" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M -25 -40 L 40 30 L 40 90 L 95 90 L 125 60 L 125 0 L 95 -30" 
      fill="none" 
      stroke="#BBF7D0" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Circuit Vias -->
    <g fill="#10B981" stroke="#FFFFFF" stroke-width="2">
      <circle cx="40" cy="90" r="5.5" />
      <circle cx="95" cy="90" r="5.5" />
      <circle cx="125" cy="60" r="5.5" />
      <circle cx="125" cy="0" r="5.5" />
      <circle cx="95" cy="-30" r="5.5" />
    </g>
    <g fill="#0B2545">
      <circle cx="40" cy="90" r="2" />
      <circle cx="95" cy="90" r="2" />
      <circle cx="125" cy="60" r="2" />
      <circle cx="125" cy="0" r="2" />
    </g>

    <!-- ARROWHEAD -->
    <path 
      d="M 50 -80 L 175 -180 L 90 -55 L 105 -95 L 60 -85 Z" 
      fill="url(#logoArrowGrad)" 
      stroke="#FFFFFF" 
      stroke-width="3" 
      stroke-linejoin="round" 
      filter="url(#logoGlow)" 
    />
    <path 
      d="M 80 -95 L 165 -170 L 110 -80 Z" 
      fill="#FFFFFF" 
      opacity="0.9" 
    />
  </g>

  <!-- Logo Text Beneath -->
  <g transform="translate(256, 430)" text-anchor="middle">
    <text 
      x="0" 
      y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="28" 
      font-weight="900" 
      letter-spacing="2" 
      fill="#0B2545"
    >
      HIGH-FREQUENCY
    </text>
    <text 
      x="0" 
      y="32" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="24" 
      font-weight="800" 
      letter-spacing="3" 
      fill="#10B981"
    >
      TRADING APP
    </text>
  </g>
</svg>
