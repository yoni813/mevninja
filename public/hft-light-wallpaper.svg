<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Soft Studio Platinum Vignette Background -->
    <radialGradient id="lightWallBg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="lightTechGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94A3B8" stroke-width="0.7" opacity="0.25" />
      <circle cx="48" cy="48" r="1.2" fill="#64748B" opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonCyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGreenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <!-- Gradients for Arrow and Graphics -->
    <linearGradient id="chartBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="circuitGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <linearGradient id="arrowHeadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <linearGradient id="textNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#lightWallBg)" />
  <rect width="1920" height="1080" fill="url(#lightTechGrid)" />

  <!-- Ambient Radiant Aura Flares Behind Central Icon -->
  <g opacity="0.75">
    <ellipse cx="900" cy="440" rx="380" ry="320" fill="#0284C7" opacity="0.18" filter="url(#neonCyanGlow)" />
    <ellipse cx="1060" cy="480" rx="400" ry="340" fill="#10B981" opacity="0.22" filter="url(#neonGreenGlow)" />
    <ellipse cx="980" cy="420" rx="260" ry="220" fill="#38BDF8" opacity="0.2" filter="url(#neonCyanGlow)" />
  </g>

  <!-- =========================================================================
       MAIN HIGH-FREQUENCY TRADING ARROW EMBLEM (Centered Motif from Uploaded Asset)
       ========================================================================= -->
  <g id="hftEmblemGroup" transform="translate(960, 430)" filter="url(#softShadow)">
    
    <!-- Outer Glow Silhouette -->
    <path 
      d="M -220 120 L -160 0 L -100 60 L -30 -60 L 50 30 L 140 -120 L 120 -150 L 220 -200 L 170 -100 L 140 -120 L 50 30 L 70 80 L 10 140 L -60 70 L -120 130 Z" 
      fill="none" 
      stroke="#38BDF8" 
      stroke-width="32" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
      opacity="0.25" 
      filter="url(#neonCyanGlow)" 
    />
    <path 
      d="M -30 -60 L 50 30 L 140 -120 L 220 -200 L 170 -100 L 50 30 L 70 80 L 120 150 L 60 190 L -10 120 Z" 
      fill="none" 
      stroke="#4ADE80" 
      stroke-width="32" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
      opacity="0.3" 
      filter="url(#neonGreenGlow)" 
    />

    <!-- Electric Lightning Flares & Speed Trails -->
    <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#neonCyanGlow)">
      <line x1="-280" y1="140" x2="-230" y2="100" />
      <line x1="-250" y1="80" x2="-190" y2="40" />
      <line x1="-210" y1="0" x2="-140" y2="-40" />
      <line x1="-120" y1="-70" x2="-60" y2="-110" />
      <line x1="30" y1="-140" x2="100" y2="-180" />
    </g>

    <g stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#neonGreenGlow)">
      <line x1="180" y1="-70" x2="240" y2="-120" />
      <line x1="190" y1="0" x2="250" y2="-40" />
      <line x1="170" y1="70" x2="220" y2="40" />
      <line x1="140" y1="130" x2="180" y2="110" />
    </g>

    <!-- LEFT FLANK: Financial Stock Chart Waveform (Blue Glowing Zigzag with Nodes) -->
    <!-- Primary Blue Chart Line -->
    <polyline 
      points="-220,130 -160,20 -100,80 -30,-50 40,40 130,-90" 
      fill="none" 
      stroke="#0284C7" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <polyline 
      points="-220,130 -160,20 -100,80 -30,-50 40,40 130,-90" 
      fill="none" 
      stroke="#38BDF8" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <polyline 
      points="-220,130 -160,20 -100,80 -30,-50 40,40 130,-90" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Lower Parallel Echo Chart Waveform -->
    <polyline 
      points="-240,170 -190,90 -130,140 -70,20 -10,100 80,-30" 
      fill="none" 
      stroke="#0284C7" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.8" 
    />
    <polyline 
      points="-240,170 -190,90 -130,140 -70,20 -10,100 80,-30" 
      fill="none" 
      stroke="#38BDF8" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.9" 
    />

    <!-- Financial Chart Nodes (Data Points / Vertices) -->
    <g fill="#0284C7" stroke="#FFFFFF" stroke-width="3">
      <circle cx="-220" cy="130" r="9" />
      <circle cx="-160" cy="20" r="9" />
      <circle cx="-100" cy="80" r="9" />
      <circle cx="-30" cy="-50" r="10" />
      <circle cx="40" cy="40" r="9" />
      <!-- Lower Wave Nodes -->
      <circle cx="-240" cy="170" r="6" />
      <circle cx="-190" cy="90" r="6" />
      <circle cx="-130" cy="140" r="6" />
      <circle cx="-70" cy="20" r="7" />
      <circle cx="-10" cy="100" r="6" />
    </g>

    <!-- Glowing Center Cores for Nodes -->
    <g fill="#38BDF8">
      <circle cx="-220" cy="130" r="4" />
      <circle cx="-160" cy="20" r="4" />
      <circle cx="-100" cy="80" r="4" />
      <circle cx="-30" cy="-50" r="5" fill="#E0F2FE" />
      <circle cx="40" cy="40" r="4" />
    </g>

    <!-- RIGHT FLANK: Green Printed Circuit Board (PCB Traces & Vias) -->
    <!-- Primary Green Circuit Route -->
    <path 
      d="M -30 -50 L 50 40 L 50 120 L 120 120 L 160 80 L 160 0 L 120 -40" 
      fill="none" 
      stroke="#059669" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M -30 -50 L 50 40 L 50 120 L 120 120 L 160 80 L 160 0 L 120 -40" 
      fill="none" 
      stroke="#10B981" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M -30 -50 L 50 40 L 50 120 L 120 120 L 160 80 L 160 0 L 120 -40" 
      fill="none" 
      stroke="#BBF7D0" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Secondary Parallel Circuit Traces -->
    <path 
      d="M 10 90 L 80 160 L 140 160 L 180 120 L 180 30" 
      fill="none" 
      stroke="#059669" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.85" 
    />
    <path 
      d="M 10 90 L 80 160 L 140 160 L 180 120 L 180 30" 
      fill="none" 
      stroke="#34D399" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <path 
      d="M -5 140 L 40 190 L 100 190 L 140 150" 
      fill="none" 
      stroke="#10B981" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.75" 
    />

    <!-- Circuit Solder Pads & Micro Vias -->
    <g fill="#10B981" stroke="#FFFFFF" stroke-width="2.5">
      <circle cx="50" cy="120" r="7" />
      <circle cx="120" cy="120" r="7" />
      <circle cx="160" cy="80" r="7" />
      <circle cx="160" cy="0" r="7" />
      <circle cx="120" cy="-40" r="7" />
      <circle cx="80" cy="160" r="6" />
      <circle cx="140" cy="160" r="6" />
      <circle cx="180" cy="120" r="6" />
      <circle cx="100" cy="190" r="5" />
    </g>
    <!-- Circuit Via Centers -->
    <g fill="#0B2545">
      <circle cx="50" cy="120" r="2.5" />
      <circle cx="120" cy="120" r="2.5" />
      <circle cx="160" cy="80" r="2.5" />
      <circle cx="160" cy="0" r="2.5" />
      <circle cx="120" cy="-40" r="2.5" />
      <circle cx="80" cy="160" r="2" />
      <circle cx="140" cy="160" r="2" />
    </g>

    <!-- UPPER ARROWHEAD CHEVRON: Neon Cyan & Green High-Velocity Arrow -->
    <!-- Large Outer Arrowhead -->
    <path 
      d="M 60 -100 L 220 -230 L 110 -70 L 130 -120 L 70 -110 Z" 
      fill="url(#arrowHeadGrad)" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linejoin="round" 
      filter="url(#neonCyanGlow)" 
    />
    
    <!-- Precision Inner Arrowhead Accent -->
    <path 
      d="M 100 -120 L 210 -220 L 135 -100 Z" 
      fill="#FFFFFF" 
      opacity="0.9" 
    />

    <!-- Secondary Forward Chevron -->
    <polyline 
      points="20,-30 110,-120 180,-190" 
      fill="none" 
      stroke="#38BDF8" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.9" 
    />
    <polyline 
      points="50,10 130,-70 200,-140" 
      fill="none" 
      stroke="#4ADE80" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.9" 
    />

    <!-- Glowing Speed Spark Points -->
    <circle cx="220" cy="-230" r="5" fill="#FFFFFF" filter="url(#neonCyanGlow)" />
    <circle cx="190" cy="-260" r="3" fill="#38BDF8" />
    <circle cx="250" cy="-210" r="3" fill="#4ADE80" />
    <circle cx="260" cy="-250" r="2" fill="#FFFFFF" />
  </g>

  <!-- =========================================================================
       TEXT BRANDING: "HIGH-FREQUENCY TRADING APP" (From Uploaded Asset)
       ========================================================================= -->
  <g id="hftBrandText" transform="translate(960, 720)" text-anchor="middle">
    <!-- Top Line: HIGH-FREQUENCY -->
    <text 
      x="0" 
      y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="52" 
      font-weight="900" 
      letter-spacing="4" 
      fill="#0B2545" 
      filter="url(#softShadow)"
    >
      HIGH-FREQUENCY
    </text>

    <!-- Cyan Glow Behind Upper Text -->
    <text 
      x="0" 
      y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="52" 
      font-weight="900" 
      letter-spacing="4" 
      fill="none" 
      stroke="#0284C7" 
      stroke-width="6" 
      opacity="0.3" 
      filter="url(#neonCyanGlow)"
    >
      HIGH-FREQUENCY
    </text>

    <!-- Bottom Line: TRADING APP -->
    <text 
      x="0" 
      y="62" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="44" 
      font-weight="800" 
      letter-spacing="6" 
      fill="#10B981" 
      filter="url(#softShadow)"
    >
      TRADING APP
    </text>

    <!-- Green Glow Behind Lower Text -->
    <text 
      x="0" 
      y="62" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="44" 
      font-weight="800" 
      letter-spacing="6" 
      fill="none" 
      stroke="#4ADE80" 
      stroke-width="5" 
      opacity="0.35" 
      filter="url(#neonGreenGlow)"
    >
      TRADING APP
    </text>

    <!-- Subtle Subtitle -->
    <text 
      x="0" 
      y="108" 
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
      font-size="14" 
      font-weight="700" 
      letter-spacing="8" 
      fill="#64748B" 
      opacity="0.85"
    >
      MSP-55 ULTRA-LOW LATENCY NITRO WORKBENCH
    </text>
  </g>
</svg>
