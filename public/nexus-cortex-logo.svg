<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="65%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <radialGradient id="spotlightBeam" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#0077FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="coatGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Noir Streetlamp Spotlight -->
  <circle cx="250" cy="240" r="180" fill="url(#spotlightBeam)" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="250" cy="240" r="195" fill="none" stroke="#0077FF" stroke-width="1" stroke-dasharray="120 80 40 60" opacity="0.3" />

  <!-- Floor Cast Shadow -->
  <ellipse cx="250" cy="430" rx="110" ry="18" fill="url(#floorShadow)" />

  <!-- 1940s Private Detective Standing Silhouette Group -->
  <g transform="translate(45, 10) scale(2.05)">
    <!-- Backlit Rim Light Outline -->
    <path
      d="
        M 82 28
        C 82 22, 92 18, 100 18
        C 108 18, 118 22, 118 28
        L 134 35
        C 137 36.5, 134 40, 126 40
        C 120 40, 118 41, 117 43
        C 117 46, 122 50, 123 54
        C 124 59, 118 64, 115 67
        L 132 78
        C 137 82, 140 89, 139 98
        L 132 148
        L 137 192
        L 125 194
        L 122 216
        L 128 220
        L 110 220
        L 112 195
        L 100 195
        L 91 195
        L 90 220
        L 72 220
        L 78 216
        L 76 194
        L 64 192
        L 69 148
        L 62 98
        C 61 89, 64 82, 69 78
        L 86 67
        C 83 64, 77 59, 78 54
        C 79 50, 84 46, 84 43
        C 83 41, 81 40, 75 40
        C 67 40, 64 36.5, 67 35
        Z
      "
      fill="none"
      stroke="url(#rimLight)"
      stroke-width="2.5"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Legs & Trousers -->
    <path
      d="
        M 86 150
        L 80 216
        L 73 218
        C 72 219, 72 221, 74 221
        L 93 221
        C 95 221, 95 219, 93 218
        L 91 216
        L 95 158
        L 105 158
        L 109 216
        L 107 218
        C 105 219, 105 221, 107 221
        L 127 221
        C 129 221, 129 219, 127 218
        L 120 216
        L 114 150
        Z
      "
      fill="url(#coatGrad)"
    />

    <!-- Long Trench Coat / Duster -->
    <path
      d="
        M 85 70
        L 68 80
        C 63 84, 61 90, 62 98
        L 67 142
        C 68 152, 65 170, 63 188
        C 63 192, 66 194, 70 194
        L 130 194
        C 134 194, 137 192, 137 188
        C 135 170, 132 152, 133 142
        L 138 98
        C 139 90, 137 84, 132 80
        L 115 70
        L 124 55
        C 120 54, 115 56, 111 60
        L 100 74
        L 89 60
        C 85 56, 80 54, 76 55
        Z
      "
      fill="url(#coatGrad)"
    />

    <!-- Belt & Buckle -->
    <path d="M 72 124 L 128 124 L 127 131 L 73 131 Z" fill="#090D16" />
    <rect x="95" y="123" width="10" height="9" rx="1.5" fill="none" stroke="#00E5FF" stroke-width="1.2" />
    <line x1="100" y1="123" x2="100" y2="132" stroke="#00E5FF" stroke-width="1" />

    <!-- Lapels -->
    <path d="M 87 64 L 100 88 L 82 82 L 77 62 Z" fill="#1E293B" stroke="#A5F3FC" stroke-width="0.8" />
    <path d="M 113 64 L 100 88 L 118 82 L 123 62 Z" fill="#0F172A" stroke="#00E5FF" stroke-width="0.8" />

    <!-- Neck & Fedora Crown -->
    <ellipse cx="100" cy="52" rx="9" ry="11" fill="url(#coatGrad)" />
    <path d="M 85 36 C 85 24, 91 19, 98 18 C 101 18, 103 21, 105 21 C 108 21, 114 24, 115 36 Z" fill="url(#coatGrad)" />
    <!-- Hatband Ribbon -->
    <path d="M 84 34 Q 100 36 116 34 L 117 38 Q 100 40 83 38 Z" fill="#00E5FF" opacity="0.9" />
    <!-- Fedora Brim -->
    <path d="M 66 36 C 75 35, 85 34, 100 34 C 118 34, 128 36, 134 37 C 138 38, 136 41, 126 42 C 112 43, 88 43, 74 41 C 64 40, 62 37, 66 36 Z" fill="#020617" stroke="#A5F3FC" stroke-width="0.8" />
  </g>

  <!-- Title Badge -->
  <text x="250" y="475" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00E5FF" letter-spacing="4">
    NEXUS CORTEX • 1940s NOIR
  </text>
</svg>
